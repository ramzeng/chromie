name: Release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize, and release
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Verify release version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version $tag_version does not match package.json version $package_version." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Prepare signing credentials
        env:
          MAC_CSC_LINK_B64: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD_VALUE: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_VALUE: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID_VALUE: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_VALUE: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail

          missing=()
          [[ -n "$MAC_CSC_LINK_B64" ]] || missing+=(MAC_CSC_LINK)
          [[ -n "$MAC_CSC_KEY_PASSWORD_VALUE" ]] || missing+=(MAC_CSC_KEY_PASSWORD)
          [[ -n "$APPLE_API_KEY_P8_VALUE" ]] || missing+=(APPLE_API_KEY_P8)
          [[ -n "$APPLE_API_KEY_ID_VALUE" ]] || missing+=(APPLE_API_KEY_ID)
          [[ -n "$APPLE_API_ISSUER_VALUE" ]] || missing+=(APPLE_API_ISSUER)

          if (( ${#missing[@]} > 0 )); then
            echo "Missing GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi

          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID_VALUE}.p8"

          # Accept the documented Base64 value as well as the complete PEM text.
          # macOS base64 can silently turn a pasted PEM into garbage, so validate
          # the decoded file before electron-builder reaches notarytool.
          if [[ "$APPLE_API_KEY_P8_VALUE" == *"-----BEGIN PRIVATE KEY-----"* ]]; then
            printf '%s' "$APPLE_API_KEY_P8_VALUE" > "$api_key_path"
          elif ! printf '%s' "$APPLE_API_KEY_P8_VALUE" | base64 --decode > "$api_key_path"; then
            echo "APPLE_API_KEY_P8 is neither a PEM private key nor valid Base64." >&2
            exit 1
          fi

          if ! openssl pkey -in "$api_key_path" -noout >/dev/null 2>&1; then
            echo "APPLE_API_KEY_P8 did not produce a valid PEM private key." >&2
            echo "Store the complete AuthKey_*.p8 file as Base64 (recommended) or raw PEM text." >&2
            exit 1
          fi

          chmod 600 "$api_key_path"

          {
            echo "APPLE_API_KEY=$api_key_path"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID_VALUE"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_VALUE"
          } >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        timeout-minutes: 3
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MAC_CSC_LINK }}
          p12-password: ${{ secrets.MAC_CSC_KEY_PASSWORD }}

      - name: Validate Apple notarization credentials
        timeout-minutes: 3
        run: bash scripts/notarize-macos.sh validate

      - name: Validate committed macOS icon
        run: sh scripts/verify-macos-icon.sh

      - name: Build and sign universal app
        timeout-minutes: 25
        run: |
          pnpm build
          pnpm exec electron-builder \
            --mac dir \
            --universal \
            --publish never \
            -c.mac.notarize=false \
            -c.forceCodeSigning=true

      - name: Verify signed universal app
        timeout-minutes: 3
        run: |
          set -euo pipefail
          app_path="dist/mac-universal/Chromie.app"

          architectures="$(lipo -archs "$app_path/Contents/MacOS/Chromie")"
          [[ "$architectures" == *arm64* ]] || { echo "Universal app is missing arm64." >&2; exit 1; }
          [[ "$architectures" == *x86_64* ]] || { echo "Universal app is missing x86_64." >&2; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$app_path"
          sh scripts/verify-macos-icon.sh "$app_path"

      - name: Submit app for notarization
        id: submit_notarization
        timeout-minutes: 15
        run: bash scripts/notarize-macos.sh submit dist/mac-universal/Chromie.app

      - name: Wait for and staple notarization
        timeout-minutes: 30
        env:
          NOTARY_SUBMISSION_ID: ${{ steps.submit_notarization.outputs.submission_id }}
          NOTARY_WAIT_TIMEOUT: 25m
        run: bash scripts/notarize-macos.sh wait dist/mac-universal/Chromie.app

      - name: Package release artifacts
        timeout-minutes: 15
        run: |
          pnpm exec electron-builder \
            --mac dmg zip \
            --universal \
            --prepackaged dist/mac-universal/Chromie.app \
            --publish never \
            -c.mac.notarize=false

      - name: Verify signed and notarized app
        timeout-minutes: 5
        run: |
          set -euo pipefail
          app_path="$(find dist -maxdepth 2 -type d -name 'Chromie.app' -print -quit)"

          if [[ -z "$app_path" ]]; then
            echo "Packaged Chromie.app was not found." >&2
            exit 1
          fi

          architectures="$(lipo -archs "$app_path/Contents/MacOS/Chromie")"
          [[ "$architectures" == *arm64* ]] || { echo "Universal app is missing arm64." >&2; exit 1; }
          [[ "$architectures" == *x86_64* ]] || { echo "Universal app is missing x86_64." >&2; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

      - name: Create checksums
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS.txt

      - name: Remove temporary notarization credential
        if: always()
        run: rm -f "$APPLE_API_KEY"

      - name: Upload test artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Chromie-macOS-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/*.dmg \
              dist/*.zip \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/*.dmg \
              dist/*.zip \
              dist/SHA256SUMS.txt \
              --verify-tag \
              --generate-notes \
              --title "Chromie $GITHUB_REF_NAME"
          fi
