<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: ws://localhost:* ws://127.0.0.1:* http://localhost:* http://127.0.0.1:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Chromie</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        margin: 0;
        background: #171717;
        color: #fafafa;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Segoe UI", sans-serif;
      }

      .boot-loading {
        position: fixed;
        inset: 0;
        box-sizing: border-box;
        display: grid;
        width: 100%;
        height: 100%;
        padding: 32px;
        place-items: center;
      }

      .boot-loading__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .boot-loading__mark {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        border-radius: 2px;
        background: #ededed;
        color: #262626;
      }

      .boot-loading__mark svg {
        width: 30px;
        height: 30px;
      }

      .boot-loading__brand {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .boot-loading__status {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #a3a3a3;
        font-size: 13px;
      }

      .boot-loading__spinner {
        flex: 0 0 auto;
        width: 14px;
        height: 14px;
        box-sizing: border-box;
        border: 2px solid rgb(255 255 255 / 16%);
        border-top-color: #fafafa;
        border-radius: 999px;
        animation: boot-spin 800ms linear infinite;
        transform-origin: center;
        will-change: transform;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-loading" role="status" aria-label="正在启动 Chromie">
        <div class="boot-loading__content">

          <p class="boot-loading__brand">Chromie</p>

        </div>
      </main>
    </div>

</html>
